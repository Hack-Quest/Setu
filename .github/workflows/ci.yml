name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 4. Write a minimal config/.env so modules that load it at import time
      #    don't crash with a missing-file error.
      #    Secrets that are not needed for unit tests are left as placeholders.
      #    Integration tests (tests/test_ngo.py) that require a live backend
      #    are skipped when SETU_BASE_URL is not a real address.
      # -----------------------------------------------------------------------
      - name: Create config/.env from GitHub Secrets
        run: |
          mkdir -p config
          cat > config/.env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          GMAIL_SENDER=${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          WEATHER_API=${{ secrets.WEATHER_API }}
          SECRET_TOKEN=${{ secrets.SECRET_TOKEN || 'ci-placeholder-token' }}
          SETU_API_BASE_URL=http://127.0.0.1:8080/
          SETU_BASE_URL=http://127.0.0.1:8080/
          EOF

      # -----------------------------------------------------------------------
      # 5. Run unit / integration tests
      #    - tests/test_ngo.py requires a live backend. It raises RuntimeError
      #      at import time if SETU_BASE_URL is unreachable, so we skip it in
      #      CI unless the secret is explicitly configured.
      #    - The --ignore flag keeps the suite green on PRs without live creds.
      # -----------------------------------------------------------------------
      - name: Run tests
        run: |
          pytest tests/ \
            --ignore=tests/test_ngo.py \
            -v \
            --tb=short
        env:
          PYTHONPATH: .

      # -----------------------------------------------------------------------
      # 6. (Optional) Run integration tests only when all secrets are present
      # -----------------------------------------------------------------------
      - name: Run integration tests (live backend required)
        if: ${{ secrets.SETU_BASE_URL != '' }}
        run: |
          pytest tests/test_ngo.py -v --tb=short
        env:
          PYTHONPATH: .
          SETU_BASE_URL: ${{ secrets.SETU_BASE_URL }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        continue-on-error: true
