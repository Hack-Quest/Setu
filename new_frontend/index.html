<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- 🔝 HEADER -->
    <header class="main-header">
        <div class="logo">SETU</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="reports.html">Reports</a>
            <a href="map.html">Map</a>
            <a href="#" onclick="openNeedForm()">Report Need</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- 🎯 HERO -->
    <section class="hero">
        <h1>Smarter Decisions. Stronger Response.</h1>
    </section>

    <!-- 🧩 ACTION CARDS -->
    <section class="cards">
        <div class="card" onclick="openNeedForm()">
            🚨 Report Emergency
        </div>

        <div class="card" onclick="openVolunteerForm()">
            🤝 Join as Volunteer
        </div>

        <div class="card" onclick="openNGOForm()">
            🏢 Register NGO
        </div>
    </section>

    <!-- 📊 STATS -->
    <section class="stats">
        <div>
            <h2 id="count">--</h2>
            <p>Emergencies</p>
        </div>
        <div>
            <h2>120</h2>
            <p>Volunteers</p>
        </div>
        <div>
            <h2>12</h2>
            <p>NGOs</p>
        </div>
    </section>

    <!-- 🗺️ MAP -->
    <section class="map-section">
        <iframe src="map.html"></iframe>
    </section>

    <!-- ✅ COMMON JS (Google Forms) -->
    <script src="js/common.js"></script>

    <!-- 📊 STATS SCRIPT -->
    <script>
        const API_BASE = "http://127.0.0.1:8000";

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/dashboard/reports`, {
                    headers: { Authorization: "Bearer hackathon-secret" }
                });

                const data = await res.json();
                const reports = data.reports || data;

                document.getElementById("count").innerText = reports.length;

            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        loadStats();
    </script>

</body>

</html>
