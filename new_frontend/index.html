<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setu • Operations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        base: '#FDFCFB',
                        surface: '#FFFFFF',
                        muted: '#F4F4F5',
                        ink: {
                            900: '#18181B',
                            700: '#3F3F46',
                            500: '#71717A',
                            300: '#D4D4D8'
                        },
                        accent: {
                            DEFAULT: '#64748B',
                            light: '#F8FAFC',
                            hover: '#475569'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-base text-ink-900 font-sans antialiased flex justify-center min-h-screen">

    <main class="w-full max-w-5xl px-6 py-12 flex flex-col gap-16">

        <!-- HEADER -->
        <header class="flex justify-between items-center fade-in-up">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 bg-ink-900 rounded-full"></div>
                <span class="text-xl font-semibold tracking-tight">Setu</span>
            </div>

            <nav class="flex items-center gap-8 text-sm font-medium text-ink-500">
                <a href="index.html" class="text-ink-900">Overview</a>
                <a href="reports.html">Reports</a>
                <a href="ngo-register.html">NGO Register</a>
                <a href="ngo-dashboard.html">NGO Dashboard</a>

                <!-- 🔥 NEW MAP BUTTON -->
                <a href="map.html" class="hover:text-ink-900 text-accent font-semibold">Tactical Map</a>

                <button class="w-10 h-10 rounded-full bg-surface border border-muted flex items-center justify-center">
                    <i data-feather="user" class="w-4 h-4"></i>
                </button>
            </nav>
        </header>

        <!-- HERO -->
        <section class="fade-in-up">
            <h1 class="text-5xl md:text-6xl font-medium tracking-tight max-w-2xl leading-[1.1]">
                Coordinate relief <span class="text-ink-300 hover:text-ink-700">effortlessly.</span>
            </h1>
            <p class="text-lg text-ink-500 max-w-xl mt-4">
                Process incoming distress signals, match volunteers, and deploy help instantly.
            </p>
        </section>

        <!-- ACTION CARDS -->
        <section class="grid grid-cols-1 md:grid-cols-12 gap-6 fade-in-up">

            <!-- NEED -->
            <button onclick="openFormModal('need')"
                class="interactive-card col-span-7 bg-surface p-10 rounded-[2rem] border border-muted shadow-soft">
                <h3 class="text-2xl font-semibold">Process New Need</h3>
                <p class="text-sm text-ink-500 mt-2">Capture emergency requests</p>
            </button>

            <!-- VOLUNTEER -->
            <button onclick="openFormModal('volunteer')"
                class="interactive-card col-span-5 bg-ink-900 p-10 rounded-[2rem] text-white">
                <h3 class="text-2xl font-semibold">Register Unit</h3>
                <p class="text-sm opacity-70 mt-2">Add volunteers</p>
            </button>

        </section>

        <!-- MATCH ENGINE -->
        <section class="border-t border-muted pt-10 fade-in-up">
            <button id="runMatchBtn" class="text-accent font-medium flex items-center">
                Trigger AI Matcher
                <i data-feather="chevron-right" class="w-4 h-4 ml-1"></i>
            </button>
        </section>

    </main>

    <!-- JS -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

    <script>
        feather.replace();

        // ✅ PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>

</body>

</html>
