<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setu • Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        base: '#FDFCFB', surface: '#FFFFFF', muted: '#F4F4F5',
                        ink: { 900: '#18181B', 700: '#3F3F46', 500: '#71717A', 300: '#D4D4D8' },
                        accent: { DEFAULT: '#64748B', light: '#F8FAFC', hover: '#475569' }
                    },
                    boxShadow: { 'soft': '0 4px 40px rgba(0, 0, 0, 0.03)', 'float': '0 20px 40px -10px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>
</head>

<body class="bg-base text-ink-900 font-sans antialiased flex justify-center min-h-screen">
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-50/40 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] bg-stone-100/50 rounded-full blur-[100px]"></div>
    </div>

    <main class="w-full max-w-5xl px-6 py-12 flex flex-col gap-16 relative">
        <header class="flex justify-between items-center w-full fade-in-up">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 bg-ink-900 rounded-full"></div>
                <span class="text-xl font-semibold tracking-tight text-ink-900">Setu</span>
            </div>
            <nav class="flex items-center gap-8 text-sm font-medium text-ink-500">
                <a href="index.html" class="text-ink-900">Overview</a>
                <a href="reports.html">Reports</a>
                <a href="ngo-register.html">NGO Register</a>
                <a href="ngo-dashboard.html">NGO Dashboard</a>
                <a href="map.html" class="text-accent font-semibold hover:text-ink-900">Tactical Map</a>
                <button
                    class="w-10 h-10 rounded-full bg-surface shadow-soft border border-muted flex items-center justify-center">
                    <i data-feather="user" class="w-4 h-4 text-ink-700"></i>
                </button>
            </nav>
        </header>

        <section class="flex flex-col gap-6 fade-in-up">
            <h1 class="text-5xl md:text-6xl font-medium tracking-tight text-ink-900 max-w-2xl leading-[1.1]">
                Coordinate relief <span class="text-ink-300 hover:text-ink-700">effortlessly.</span>
            </h1>
            <p class="text-lg text-ink-500 max-w-xl font-light">Unified interface to process signals and deploy units.
            </p>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-12 gap-6 fade-in-up">
            <button onclick="openFormModal('need')"
                class="interactive-card col-span-7 bg-surface p-10 rounded-[2rem] border border-muted shadow-soft text-left">
                <h3 class="text-2xl font-semibold mb-2">Process New Need</h3>
                <p class="text-ink-500 text-sm">Capture details from ground zero.</p>
            </button>
            <button onclick="openFormModal('volunteer')"
                class="interactive-card col-span-5 bg-ink-900 p-10 rounded-[2rem] text-left text-white">
                <h3 class="text-2xl font-semibold mb-2">Register Unit</h3>
                <p class="text-white/60 text-sm">Onboard response volunteers.</p>
            </button>
        </section>

        <section class="border-t border-muted pt-12 grid grid-cols-1 md:grid-cols-3 gap-12 fade-in-up">
            <div>
                <span class="text-xs font-bold uppercase text-ink-500">Reports</span>
                <p id="statNeeds" class="text-4xl font-light text-ink-900">0</p>
            </div>
            <div>
                <span class="text-xs font-bold uppercase text-ink-500">Volunteers</span>
                <p id="statUnits" class="text-4xl font-light text-ink-900">0</p>
            </div>
            <button id="runMatchBtn" class="text-accent font-medium flex items-center group">
                <span id="btnText">Trigger AI Matcher</span>
                <i data-feather="chevron-right" class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform"></i>
            </button>
        </section>

        <footer class="border-t border-muted py-8 flex justify-between items-center fade-in-up">
            <span class="text-xs font-medium text-ink-300 uppercase tracking-widest">Setu OS 1.0</span>
        </footer>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        feather.replace();
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/service-worker.js'); }
    </script>
</body>

</html>
