<!DOCTYPE html>
<html>

<head>
    <title>Setu Tactical Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
        }

        #status {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 13px;
            display: none;
            max-width: 520px;
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="status"></div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <script>
        const API = "http://127.0.0.1:8000/dashboard/reports";

        let map;
        let overlays = [];

        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
        }

        // 🎨 color logic
        function getColor(severity) {
            severity = (severity || '').toLowerCase();
            if (severity === 'critical') return "red";
            if (severity === 'high') return "orange";
            if (severity === 'medium') return "yellow";
            return "green";
        }

        // 🗺️ init map
        function initMap() {
            map = L.map('map', {
                center: [20.5937, 78.9629],
                zoom: 5,
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            loadNeeds();
            setInterval(loadNeeds, 5000);
        }

        // 🧹 clear everything
        function clearAll() {
            overlays.forEach(item => map.removeLayer(item));
            overlays = [];
        }

        // 🔄 fetch + render
        async function loadNeeds() {
            try {
                const res = await fetch(API);
                const raw = await res.json();
                const reports = raw.reports || raw;

                clearAll();
                const bounds = [];

                reports.forEach(r => {

                    if (r.lat === null || r.lng === null) return;

                    const lat = parseFloat(r.lat);
                    const lng = parseFloat(r.lng);

                    if (isNaN(lat) || isNaN(lng)) return;

                    const isCritical = r.severity?.toLowerCase() === "critical";

                    // 🔴 NEED MARKER
                    const marker = L.circleMarker([lat, lng], {
                        radius: isCritical ? 12 : 8,
                        color: getColor(r.severity),
                        fillColor: getColor(r.severity),
                        fillOpacity: isCritical ? 1 : 0.8,
                        weight: 2
                    });
                    marker.addTo(map);

                    marker.bindPopup(`
                    <div style="font-family:sans-serif">
                        <b>${r.disaster_type || 'Need'}</b><br>
                        ${r.description || ''}<br><br>
                        <b>Severity:</b> ${r.severity}<br>
                        <b>Help:</b> ${r.help_needed || 'N/A'}
                    </div>
                `);

                    // 🔥 Pulse animation for CRITICAL
                    if (isCritical) {
                        let grow = true;
                        setInterval(() => {
                            const radius = grow ? 14 : 8;
                            marker.setStyle({ radius, fillColor: 'red', color: 'red', fillOpacity: 1 });
                            grow = !grow;
                        }, 600);
                    }

                    overlays.push(marker);
                    bounds.push([lat, lng]);

                    // 🔵 REAL OR DEMO VOLUNTEER + LINE

                    let vLat, vLng;

                    if (r.volunteer_lat && r.volunteer_lng) {
                        // ✅ real data
                        vLat = parseFloat(r.volunteer_lat);
                        vLng = parseFloat(r.volunteer_lng);
                    } else {
                        // 🔥 DEMO fallback (always show line)
                        vLat = lat + 0.2;
                        vLng = lng + 0.2;
                    }

                    // 🔵 volunteer marker
                    const volunteerMarker = L.circleMarker([vLat, vLng], {
                        radius: 7,
                        color: '#007bff',
                        fillColor: '#007bff',
                        fillOpacity: 0.9,
                        weight: 1
                    });
                    volunteerMarker.addTo(map);

                    overlays.push(volunteerMarker);
                    bounds.push([vLat, vLng]);

                    // 🔗 connection line
                    const line = L.polyline([
                        [lat, lng],
                        [vLat, vLng]
                    ], {
                        color: '#007bff',
                        opacity: 0.8,
                        weight: 3
                    });
                    line.addTo(map);
                    overlays.push(line);

                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }

            } catch (err) {
                console.error("Map error:", err);
                showStatus(`Map error: ${err.message || err}`);
            }
        }

        initMap();
    </script>

</body>

</html>
