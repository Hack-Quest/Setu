<!DOCTYPE html>
<html>

<head>
    <title>Setu Tactical Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            margin: 0;
        }

        #map {
            height: calc(100vh - 60px);
        }

        #status {
            position: fixed;
            top: 70px;
            left: 12px;
            z-index: 20;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 13px;
            display: none;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="logo">SETU</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="reports.html">Reports</a>
            <a href="#" onclick="openNeedForm()">Report Need</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div id="map"></div>
    <div id="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>

    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const API = `${API_BASE}/dashboard/reports`;

        function openNeedForm() {
            window.open("https://forms.gle/YOUR_NEED_FORM", "_blank");
        }

        let map;
        let overlays = [];

        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
        }

        function getColor(severity) {
            severity = (severity || '').toLowerCase();
            if (severity === 'critical') return "red";
            if (severity === 'high') return "orange";
            if (severity === 'medium') return "yellow";
            return "green";
        }

        function initMap() {
            // Default center, will be overridden by fitBounds later
            map = L.map('map').setView([20.5937, 78.9629], 5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            loadNeeds();
            setInterval(loadNeeds, 5000);
        }

        function clearAll() {
            overlays.forEach(item => map.removeLayer(item));
            overlays = [];
        }

        async function loadNeeds() {
            try {
                const res = await fetch(API, {
                    headers: { Authorization: "Bearer hackathon-secret" }
                });

                const raw = response.data;
                const reports = raw.reports || raw;

                clearAll();
                const bounds = [];

                // 🔥 ADDED: Create a Cluster Group for SOS markers
                const markersCluster = L.markerClusterGroup({
                    maxClusterRadius: 50 // Kitne pass hone par merge honge (adjust if needed)
                });

                reports.forEach(r => {
                    if (!r.lat || !r.lng) return;

                    const lat = parseFloat(r.lat);
                    const lng = parseFloat(r.lng);

                    if (isNaN(lat) || isNaN(lng)) return;

                    const isCritical = r.severity?.toLowerCase() === "critical";

                    // Create SOS Marker
                    const marker = L.circleMarker([lat, lng], {
                        radius: isCritical ? 12 : 8,
                        color: getColor(r.severity),
                        fillColor: getColor(r.severity),
                        fillOpacity: 0.9
                    });

                    marker.bindPopup(`
                        <b>${r.disaster_type || 'Need'}</b><br>
                        ${r.description || ''}<br>
                        Severity: ${r.severity}
                    `);

                    if (isCritical) {
                        let grow = true;
                        setInterval(() => {
                            marker.setStyle({ radius: grow ? 14 : 8 });
                            grow = !grow;
                        }, 600);
                    }

                    // 🔥 ADDED: Add marker to Cluster instead of directly to Map
                    markersCluster.addLayer(marker);
                    bounds.push([lat, lng]);

                    // Volunteer mapping (Kept separate from cluster so lines don't break)
                    let vLat = r.volunteer_lat ? parseFloat(r.volunteer_lat) : null;
                    let vLng = r.volunteer_lng ? parseFloat(r.volunteer_lng) : null;

                    if (vLat && vLng) {
                        const volunteerMarker = L.circleMarker([vLat, vLng], {
                            radius: 7, color: '#007bff', fillColor: '#007bff', fillOpacity: 0.9
                        }).addTo(map);
                        overlays.push(volunteerMarker);
                        bounds.push([vLat, vLng]);

                        const line = L.polyline([[lat, lng], [vLat, vLng]], {
                            color: '#007bff', weight: 3
                        }).addTo(map);
                        overlays.push(line);
                    }
                });

                // 🔥 ADDED: Add the whole cluster group to the map
                map.addLayer(markersCluster);
                overlays.push(markersCluster); // So it gets cleared on refresh

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }

            } catch (err) {
                console.error("Map error:", err);
                showStatus("Error loading map data");
            }
            
        }

        initMap();
    </script>
</body>

</html>
