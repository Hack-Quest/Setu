<!DOCTYPE html>
<html>

<head>
    <title>Setu Tactical Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            margin: 0;
        }

        #map {
            height: calc(100vh - 60px);
            /* header adjust */
        }

        #status {
            position: fixed;
            top: 70px;
            left: 12px;
            z-index: 20;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 13px;
            display: none;
        }
    </style>
</head>

<body>

    <!-- 🔝 COMMON HEADER -->
    <header class="main-header">
        <div class="logo">SETU</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="reports.html">Reports</a>
            <a href="#" onclick="openNeedForm()">Report Need</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div id="map"></div>
    <div id="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // 🔥 CONFIG
        const API_BASE = "http://127.0.0.1:8000";
        const API = `${API_BASE}/dashboard/reports`;

        // 🔗 Google Form
        function openNeedForm() {
            window.open("https://forms.gle/YOUR_NEED_FORM", "_blank");
        }

        let map;
        let overlays = [];

        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
        }

        // 🎨 severity color
        function getColor(severity) {
            severity = (severity || '').toLowerCase();
            if (severity === 'critical') return "red";
            if (severity === 'high') return "orange";
            if (severity === 'medium') return "yellow";
            return "green";
        }

        // 🗺️ INIT
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
                .addTo(map);

            loadNeeds();
            setInterval(loadNeeds, 5000);
        }

        // 🧹 CLEAR
        function clearAll() {
            overlays.forEach(item => map.removeLayer(item));
            overlays = [];
        }

        // 🔄 LOAD DATA
        async function loadNeeds() {
            try {
                const res = await fetch(API, {
                    headers: {
                        Authorization: "Bearer hackathon-secret"
                    }
                });

                const raw = await res.json();
                const reports = raw.reports || raw;

                clearAll();
                const bounds = [];

                reports.forEach(r => {

                    if (!r.lat || !r.lng) return;

                    const lat = parseFloat(r.lat);
                    const lng = parseFloat(r.lng);

                    if (isNaN(lat) || isNaN(lng)) return;

                    const isCritical = r.severity?.toLowerCase() === "critical";

                    // 🔴 NEED
                    const marker = L.circleMarker([lat, lng], {
                        radius: isCritical ? 12 : 8,
                        color: getColor(r.severity),
                        fillColor: getColor(r.severity),
                        fillOpacity: 0.9
                    }).addTo(map);

                    marker.bindPopup(`
                <b>${r.disaster_type || 'Need'}</b><br>
                ${r.description || ''}<br>
                Severity: ${r.severity}
            `);

                    // 🔥 pulse
                    if (isCritical) {
                        let grow = true;
                        setInterval(() => {
                            marker.setStyle({
                                radius: grow ? 14 : 8
                            });
                            grow = !grow;
                        }, 600);
                    }

                    overlays.push(marker);
                    bounds.push([lat, lng]);

                    // 🔵 volunteer + 🔗 line only when real coordinates exist
                    const hasVolunteerCoords =
                        r.volunteer_lat !== undefined &&
                        r.volunteer_lat !== null &&
                        r.volunteer_lat !== "" &&
                        r.volunteer_lng !== undefined &&
                        r.volunteer_lng !== null &&
                        r.volunteer_lng !== "";

                    if (hasVolunteerCoords) {
                        const vLat = parseFloat(r.volunteer_lat);
                        const vLng = parseFloat(r.volunteer_lng);

                        if (!isNaN(vLat) && !isNaN(vLng)) {
                            const volunteerMarker = L.circleMarker([vLat, vLng], {
                                radius: 7,
                                color: '#007bff',
                                fillColor: '#007bff',
                                fillOpacity: 0.9
                            }).addTo(map);

                            overlays.push(volunteerMarker);
                            bounds.push([vLat, vLng]);

                            const line = L.polyline([[lat, lng], [vLat, vLng]], {
                                color: '#007bff',
                                weight: 3
                            }).addTo(map);

                            overlays.push(line);
                        }
                    }
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }

            } catch (err) {
                console.error("Map error:", err);
                showStatus(err.message);
            }
        }

        initMap();

    </script>

</body>

</html>
