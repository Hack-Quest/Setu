<!DOCTYPE html>
<html>

<head>
    <title>Setu Tactical Map (Google)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>
        const API = "http://127.0.0.1:8000/dashboard/reports";

        let map;
        let markers = [];
        let lines = [];

        // 🎨 color logic
        function getColor(severity) {
            severity = (severity || '').toLowerCase();
            if (severity === 'critical') return "red";
            if (severity === 'high') return "orange";
            if (severity === 'medium') return "yellow";
            return "green";
        }

        // 🗺️ init map
        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 20.5937, lng: 78.9629 },
                zoom: 5,
            });

            loadNeeds();
            setInterval(loadNeeds, 5000);
        }

        // 🧹 clear everything
        function clearAll() {
            markers.forEach(m => m.setMap(null));
            markers = [];

            lines.forEach(l => l.setMap(null));
            lines = [];
        }

        // 🔄 fetch + render
        async function loadNeeds() {
            try {
                const res = await fetch(API);
                const raw = await res.json();
                const reports = raw.reports || raw;

                clearAll();

                reports.forEach(r => {

                    if (r.lat === null || r.lng === null) return;

                    const lat = parseFloat(r.lat);
                    const lng = parseFloat(r.lng);

                    if (isNaN(lat) || isNaN(lng)) return;

                    const isCritical = r.severity?.toLowerCase() === "critical";

                    // 🔴 NEED MARKER
                    const marker = new google.maps.Marker({
                        position: { lat, lng },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: isCritical ? 12 : 8,
                            fillColor: getColor(r.severity),
                            fillOpacity: isCritical ? 1 : 0.8,
                            strokeWeight: 2
                        },
                        label: {
                            text: r.severity?.toUpperCase() || "",
                            color: "white",
                            fontSize: "10px"
                        }
                    });

                    // 📦 POPUP
                    const info = new google.maps.InfoWindow({
                        content: `
                    <div style="font-family:sans-serif">
                        <b>${r.disaster_type || 'Need'}</b><br>
                        ${r.description || ''}<br><br>
                        <b>Severity:</b> ${r.severity}<br>
                        <b>Help:</b> ${r.help_needed || 'N/A'}
                    </div>
                `
                    });

                    marker.addListener("click", () => {
                        info.open(map, marker);
                    });

                    // 🔥 Pulse animation for CRITICAL
                    if (isCritical) {
                        let grow = true;
                        setInterval(() => {
                            const scale = grow ? 14 : 8;
                            marker.setIcon({
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: scale,
                                fillColor: "red",
                                fillOpacity: 1,
                                strokeWeight: 2
                            });
                            grow = !grow;
                        }, 600);
                    }

                    markers.push(marker);

                    // 🔵 REAL OR DEMO VOLUNTEER + LINE

                    let vLat, vLng;

                    if (r.volunteer_lat && r.volunteer_lng) {
                        // ✅ real data
                        vLat = parseFloat(r.volunteer_lat);
                        vLng = parseFloat(r.volunteer_lng);
                    } else {
                        // 🔥 DEMO fallback (always show line)
                        vLat = lat + 0.2;
                        vLng = lng + 0.2;
                    }

                    // 🔵 volunteer marker
                    const volunteerMarker = new google.maps.Marker({
                        position: { lat: vLat, lng: vLng },
                        map: map,
                        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
                    });

                    markers.push(volunteerMarker);

                    // 🔗 connection line
                    const line = new google.maps.Polyline({
                        path: [
                            { lat: lat, lng: lng },
                            { lat: vLat, lng: vLng }
                        ],
                        geodesic: true,
                        strokeColor: "#007bff",
                        strokeOpacity: 0.8,
                        strokeWeight: 3
                    });

                    line.setMap(map);
                    lines.push(line);

                    // 🎯 auto focus
                    map.panTo({ lat, lng });

                });

            } catch (err) {
                console.error("Map error:", err);
            }
        }
    </script>

    <!-- 🔥 PUT YOUR API KEY -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_KEY&callback=initMap">
        </script>

</body>

</html>
