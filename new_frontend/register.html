<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register • Setu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        base: '#FDFCFB',
                        surface: '#FFFFFF',
                        muted: '#F4F4F5',
                        ink: {
                            900: '#0F1419',
                            700: '#2C3E50',
                            500: '#5A6C7D',
                            300: '#D4D4D8'
                        },
                        primary: {
                            DEFAULT: '#0F1419',
                            light: '#1A202C',
                            lighter: '#2D3748'
                        },
                        accent: {
                            DEFAULT: '#FF6B35',
                            light: '#FFF3E0',
                            hover: '#E55100',
                            dark: '#D84315'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 40px rgba(0, 0, 0, 0.03)',
                        'float': '0 20px 40px -10px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FDFCFB 0%, #F8F7F3 100%);
        }
    </style>
</head>

<body
    class="bg-base text-ink-900 font-sans antialiased overflow-x-hidden selection:bg-accent-light selection:text-ink-900">

    <!-- Ambient background elements -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] right-[-15%] w-[500px] h-[500px] bg-accent-light/30 rounded-full blur-[140px]">
        </div>
        <div class="absolute bottom-[-5%] left-[-10%] w-[400px] h-[400px] bg-blue-100/20 rounded-full blur-[120px]">
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full min-h-screen flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-xl">

            <!-- Logo & Header -->
            <div class="mb-12 text-center fade-in-up" style="animation-delay: 0.1s;">
                <div class="flex items-center justify-center gap-2 mb-8">
                    <div class="w-3 h-3 bg-accent rounded-full"></div>
                    <span class="text-2xl font-semibold tracking-tight text-ink-900">Setu</span>
                </div>
                <h1 class="text-3xl font-semibold text-ink-900 mb-2">Join the Response</h1>
                <p class="text-ink-500 text-sm">Create your account to help coordinate relief operations</p>
            </div>

            <!-- Registration Form Card -->
            <div class="bg-surface rounded-2xl shadow-soft border border-muted p-8 fade-in-up"
                style="animation-delay: 0.2s;">

                <form id="registerForm" class="flex flex-col gap-4">

                    <!-- Name Field -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label for="name" class="text-sm font-medium text-ink-900">Full Name</label>
                            <div class="relative">
                                <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                    <i data-feather="user" class="w-5 h-5"></i>
                                </div>
                                <input type="text" id="name" name="name" placeholder="Your name" required
                                    class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                            </div>
                        </div>

                        <!-- Phone Field -->
                        <div class="flex flex-col gap-2">
                            <label for="phone" class="text-sm font-medium text-ink-900">Phone</label>
                            <div class="relative">
                                <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                    <i data-feather="phone" class="w-5 h-5"></i>
                                </div>
                                <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required
                                    class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                            </div>
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="flex flex-col gap-2">
                        <label for="email" class="text-sm font-medium text-ink-900">Email Address</label>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                <i data-feather="mail" class="w-5 h-5"></i>
                            </div>
                            <input type="email" id="email" name="email" placeholder="you@organization.org" required
                                class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                        </div>
                    </div>

                    <!-- Location Field -->
                    <div class="flex flex-col gap-2">
                        <label for="location" class="text-sm font-medium text-ink-900">Base Location</label>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                <i data-feather="map-pin" class="w-5 h-5"></i>
                            </div>
                            <input type="text" id="location" name="location" placeholder="City/Region" required
                                class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                        </div>
                    </div>

                    <!-- Skills Field (Multi-select) -->
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-ink-900">Skills (Select all that apply)</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label
                                class="flex items-center gap-3 p-3 bg-muted rounded-lg cursor-pointer hover:bg-muted/80 transition-colors">
                                <input type="checkbox" name="skills" value="Medical"
                                    class="w-4 h-4 rounded border-accent text-accent cursor-pointer">
                                <span class="text-sm text-ink-900">Medical</span>
                            </label>
                            <label
                                class="flex items-center gap-3 p-3 bg-muted rounded-lg cursor-pointer hover:bg-muted/80 transition-colors">
                                <input type="checkbox" name="skills" value="Logistics"
                                    class="w-4 h-4 rounded border-accent text-accent cursor-pointer">
                                <span class="text-sm text-ink-900">Logistics</span>
                            </label>
                            <label
                                class="flex items-center gap-3 p-3 bg-muted rounded-lg cursor-pointer hover:bg-muted/80 transition-colors">
                                <input type="checkbox" name="skills" value="Search & Rescue"
                                    class="w-4 h-4 rounded border-accent text-accent cursor-pointer">
                                <span class="text-sm text-ink-900">Search & Rescue</span>
                            </label>
                            <label
                                class="flex items-center gap-3 p-3 bg-muted rounded-lg cursor-pointer hover:bg-muted/80 transition-colors">
                                <input type="checkbox" name="skills" value="Communications"
                                    class="w-4 h-4 rounded border-accent text-accent cursor-pointer">
                                <span class="text-sm text-ink-900">Communications</span>
                            </label>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="flex flex-col gap-2 pt-2">
                        <label for="password" class="text-sm font-medium text-ink-900">Create Password</label>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                <i data-feather="lock" class="w-5 h-5"></i>
                            </div>
                            <input type="password" id="password" name="password" placeholder="Minimum 8 characters"
                                required minlength="8"
                                class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                        </div>
                        <p class="text-xs text-ink-500">Use a mix of letters, numbers, and symbols for better security.
                        </p>
                    </div>

                    <!-- Error Message -->
                    <div id="errorMsg"
                        class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
                        <i data-feather="alert-circle" class="w-4 h-4"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" id="submitBtn"
                        class="w-full mt-4 py-3 bg-accent hover:bg-accent-hover text-white font-semibold rounded-lg transition-all duration-200 flex items-center justify-center gap-2 group">
                        <span id="btnText">Create Account</span>
                        <i id="btnIcon" data-feather="arrow-right"
                            class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <!-- Sign In Link -->
                    <div class="text-center mt-2">
                        <p class="text-sm text-ink-500">
                            Already have an account?
                            <a href="login.html"
                                class="font-semibold text-accent hover:text-accent-hover transition-colors">Sign in</a>
                        </p>
                    </div>
                </form>

            </div>

            <!-- Privacy Notice -->
            <div class="mt-8 text-center text-xs text-ink-500 fade-in-up" style="animation-delay: 0.3s;">
                <p>By registering, you agree to our <a href="#" class="text-accent hover:underline">Terms of Service</a>
                    and <a href="#" class="text-accent hover:underline">Privacy Policy</a></p>
            </div>

        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-ink-900 text-white px-5 py-3 rounded-full text-sm font-medium shadow-float transform translate-y-8 opacity-0 transition-all duration-400 ease-out pointer-events-none flex items-center gap-2 z-50">
        <i data-feather="check-circle" class="w-4 h-4 text-white/70"></i>
        <span id="toastMsg">Action complete.</span>
    </div>

    <script src="js/api.js"></script>
    <script>
        feather.replace();

        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const location = document.getElementById('location').value.trim();
            const password = document.getElementById('password').value;

            // Get selected skills
            const skillCheckboxes = document.querySelectorAll('input[name="skills"]:checked');
            const skills = Array.from(skillCheckboxes).map(cb => cb.value);

            if (!name || !phone || !email || !location || !password || skills.length === 0) {
                showError('Please fill in all fields and select at least one skill');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters long');
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Creating account...';

            try {
                const response = await ApiService.register({
                    email,
                    password,
                    name,
                    phone,
                    location,
                    skills
                });

                if (!response.ok) {
                    showError(response.error || 'Registration failed. Please try again.');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Create Account';
                    return;
                }

                const data = response.data;

                // Store auth info
                localStorage.setItem('auth_token', data.token || 'hackathon-secret');
                localStorage.setItem('user_email', email);
                localStorage.setItem('volunteer_id', data.volunteer_id || '');
                localStorage.setItem('user_name', name);

                showToast('Account created successfully! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                showError('Connection error. Please try again.');
                submitBtn.disabled = false;
                btnText.textContent = 'Create Account';
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                errorMsg.classList.add('hidden');
            }, 5000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-8', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
        }
    </script>
</body>

</html>
