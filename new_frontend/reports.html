<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setu • Live Reports</title>
    <!-- Use elegant, refined typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        base: '#FDFCFB',
                        surface: '#FFFFFF',
                        muted: '#F4F4F5',
                        ink: {
                            900: '#18181B',
                            700: '#3F3F46',
                            500: '#71717A',
                            300: '#D4D4D8'
                        },
                        accent: {
                            DEFAULT: '#64748B',
                            light: '#F8FAFC',
                            hover: '#475569'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 40px rgba(0, 0, 0, 0.03)',
                        'float': '0 20px 40px -10px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-base text-ink-900 font-sans antialiased overflow-x-hidden selection:bg-accent-light selection:text-ink-900 flex justify-center min-h-screen">

    <!-- Ambient soft background mesh -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-50/40 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] bg-stone-100/50 rounded-full blur-[100px]"></div>
    </div>

    <!-- Main Central App Layout -->
    <main class="w-full max-w-5xl px-6 py-12 flex flex-col gap-10 relative">
        
        <!-- Header -->
        <header class="flex justify-between items-center w-full fade-in-up" style="animation-delay: 0.1s;">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 bg-ink-900 rounded-full"></div>
                <span class="text-xl font-semibold tracking-tight text-ink-900">Setu</span>
            </div>
            <nav class="flex items-center gap-8 text-sm font-medium text-ink-500">
                <a href="index.html" class="hover:text-ink-900 transition-colors">Overview</a>
                <a href="reports.html" class="text-ink-900 transition-colors">Reports</a>
                <a href="#" class="hover:text-ink-900 transition-colors">Logistics</a>
                <button class="w-10 h-10 rounded-full bg-surface shadow-soft border border-muted flex items-center justify-center hover:bg-muted transition-all">
                    <i data-feather="user" class="w-4 h-4 text-ink-700"></i>
                </button>
            </nav>
        </header>

        <!-- Dynamic Header -->
        <section class="flex flex-col gap-3 fade-in-up" style="animation-delay: 0.2s;">
            <h1 class="text-4xl font-medium tracking-tight text-ink-900">Active Signals</h1>
            <p class="text-ink-500 max-w-xl font-light">Real-time distress signals pulling directly from the centralized databank.</p>
        </section>

        <!-- Reports Container -->
        <section class="fade-in-up flex-1 flex flex-col" style="animation-delay: 0.3s;">
            
            <!-- Loading Indicator -->
            <div id="loader" class="flex items-center gap-3 text-ink-500 py-10">
                <i data-feather="loader" class="w-5 h-5 animate-spin"></i>
                <span class="text-sm font-medium">Syncing databank...</span>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-center border border-dashed border-muted rounded-[2rem]">
                <i data-feather="check-circle" class="w-8 h-8 text-ink-300 mb-4"></i>
                <h3 class="text-lg font-medium text-ink-900 mb-1">Clear Queue</h3>
                <p class="text-sm text-ink-500">No active distress signals in your network.</p>
            </div>

            <!-- List Grid -->
            <div id="reportsList" class="hidden flex flex-col gap-4">
                <!-- Javascript will inject list items here -->
            </div>
            
        </section>
        
        <footer class="border-t border-muted py-8 flex justify-between items-center fade-in-up" style="animation-delay: 0.4s;">
            <span class="text-xs font-medium text-ink-300 uppercase tracking-widest">Setu OS 1.0</span>
            <span class="text-xs text-ink-500 tracking-wide">Command strictly restricted.</span>
        </footer>

    </main>

    <script>
        // Initialize icons
        feather.replace();
    </script>
    <script src="js/api.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
