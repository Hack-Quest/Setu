<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU – NGOs</title>
    <meta name="description" content="Browse registered NGOs on the SETU disaster response platform.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reports.css">
</head>

<body>

    <!-- 🔝 NAVBAR -->
    <header class="main-header">
        <div class="logo">SETU</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="reports.html">Reports</a>
            <a href="map.html">Map</a>
            <a href="#" onclick="openNeedForm()">Report Need</a>
            <a href="login.html" class="nav-login-btn">Login</a>
        </nav>
    </header>

    <!-- 📐 MAIN CONTAINER -->
    <div class="reports-container">

        <!-- Page header -->
        <div class="ops-page-header">
            <div>
                <h1 class="ops-title">🏢 NGOs</h1>
                <p class="ops-subtitle">Registered organizations helping in disaster response</p>
            </div>

            <!-- Filter bar -->
            <div class="ops-filters">
                <button class="filter-btn filter-btn--active" onclick="filterNGOs('all')" id="filter-all">All</button>
                <button class="filter-btn filter-btn--ok" onclick="filterNGOs('verified')" id="filter-verified">Verified</button>
                <button class="filter-btn filter-btn--medium" onclick="filterNGOs('unverified')" id="filter-unverified">Unverified</button>
            </div>
        </div>

        <!-- Loading state -->
        <div id="reports-loading" class="ops-loading">
            <div class="ops-spinner"></div>
            <p>Fetching NGOs…</p>
        </div>

        <!-- Report grid — single section -->
        <div id="reportsList" class="report-list"></div>

    </div>

    <div id="toast-container"></div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ngos.js"></script>

</body>
</html>
