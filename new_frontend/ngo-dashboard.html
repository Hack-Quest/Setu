<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>
        .container {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .card {
            background: #393E46;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .btn {
            margin-top: 10px;
            padding: 8px 12px;
            background: #948979;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .status {
            font-size: 12px;
            margin-left: 10px;
        }

        .available {
            color: lightgreen;
        }

        .busy {
            color: orange;
        }
    </style>
</head>

<body>

    <header>
        <h2>SETU</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="reports.html">Reports</a>
            <a href="map.html">Map</a>
        </nav>
    </header>

    <div class="container">

        <h1>NGO Dashboard</h1>

        <!-- 📍 REPORTS -->
        <div class="section">
            <h2>Active Reports</h2>
            <div id="reports"></div>
        </div>

    </div>

    <script>

        // 🔥 API BASE
        const API_BASE = "http://127.0.0.1:8000";

        // 📦 REPORTS DATA
        let reports = [];

        // 🔄 FETCH REPORTS FROM BACKEND
        async function fetchReports() {
            try {
                const res = await fetch(`${API_BASE}/dashboard/reports`, {
                    headers: {
                        Authorization: "Bearer hackathon-secret"
                    }
                });

                const data = await res.json();
                reports = data.reports || data;

                console.log("Reports:", reports);

                renderReports();

            } catch (err) {
                console.error("Error fetching reports:", err);
            }
        }

        // 🎨 RENDER REPORTS
        function renderReports() {
            const container = document.getElementById("reports");
            container.innerHTML = "";

            if (!reports || reports.length === 0) {
                container.innerHTML = "<p>No reports available</p>";
                return;
            }

            reports.forEach(r => {

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
            <h3>${r.disaster_type || "Emergency"}</h3>
            <p>${r.description || ""}</p>

            <p><b>Severity:</b> ${r.severity || "Unknown"}</p>
            <p><b>Status:</b> ${r.status || "Pending"}</p>

            <button class="btn" onclick="assignVolunteer('${r.id}')">
                Assign Volunteer
            </button>

            <button class="btn" onclick="markResolved('${r.id}')">
                Mark Resolved
            </button>
        `;

                container.appendChild(card);
            });
        }

        // 🔗 ASSIGN VOLUNTEER (MATCH API)
        async function assignVolunteer(reportId) {
            try {
                const res = await fetch(`${API_BASE}/match`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: "Bearer hackathon-secret"
                    },
                    body: JSON.stringify({ report_id: reportId })
                });

                const data = await res.json();

                alert("Assigned to: " + (data.volunteer_name || "No volunteer found"));

                fetchReports(); // refresh

            } catch (err) {
                console.error("Assign error:", err);
            }
        }

        // ✅ MARK RESOLVED
        async function markResolved(reportId) {
            try {
                await fetch(`${API_BASE}/assignment/${reportId}/resolve`, {
                    method: "PATCH",
                    headers: {
                        Authorization: "Bearer hackathon-secret"
                    }
                });

                alert("Marked as resolved");

                fetchReports();

            } catch (err) {
                console.error("Resolve error:", err);
            }
        }

        // 🚀 INIT
        fetchReports();

    </script>

</body>

</html>
