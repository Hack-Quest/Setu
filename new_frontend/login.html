<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In • Setu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        // Navy/Charcoal primary, Safety Orange accent
                        base: '#FDFCFB',
                        surface: '#FFFFFF',
                        muted: '#F4F4F5',
                        ink: {
                            900: '#0F1419',  // Deep Navy/Charcoal
                            700: '#2C3E50',  // Navy-dark
                            500: '#5A6C7D',  // Navy-medium
                            300: '#D4D4D8'
                        },
                        primary: {
                            DEFAULT: '#0F1419',
                            light: '#1A202C',
                            lighter: '#2D3748'
                        },
                        accent: {
                            DEFAULT: '#FF6B35',  // Safety Orange
                            light: '#FFF3E0',   // Light orange bg
                            hover: '#E55100',   // Darker orange
                            dark: '#D84315'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 40px rgba(0, 0, 0, 0.03)',
                        'float': '0 20px 40px -10px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FDFCFB 0%, #F8F7F3 100%);
        }
    </style>
</head>

<body
    class="bg-base text-ink-900 font-sans antialiased overflow-x-hidden selection:bg-accent-light selection:text-ink-900">

    <!-- Ambient background elements -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] right-[-15%] w-[500px] h-[500px] bg-accent-light/30 rounded-full blur-[140px]">
        </div>
        <div class="absolute bottom-[-5%] left-[-10%] w-[400px] h-[400px] bg-blue-100/20 rounded-full blur-[120px]">
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full min-h-screen flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">

            <!-- Logo & Header -->
            <div class="mb-12 text-center fade-in-up" style="animation-delay: 0.1s;">
                <div class="flex items-center justify-center gap-2 mb-8">
                    <div class="w-3 h-3 bg-accent rounded-full"></div>
                    <span class="text-2xl font-semibold tracking-tight text-ink-900">Setu</span>
                </div>
                <h1 class="text-3xl font-semibold text-ink-900 mb-2">Welcome Back</h1>
                <p class="text-ink-500 text-sm">Sign in to coordinate disaster relief operations</p>
            </div>

            <!-- Sign In Form Card -->
            <div class="bg-surface rounded-2xl shadow-soft border border-muted p-8 fade-in-up"
                style="animation-delay: 0.2s;">

                <form id="loginForm" class="flex flex-col gap-5">
                    <!-- Email Field -->
                    <div class="flex flex-col gap-2">
                        <label for="email" class="text-sm font-medium text-ink-900">Email Address</label>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                <i data-feather="mail" class="w-5 h-5"></i>
                            </div>
                            <input type="email" id="email" name="email" placeholder="you@organization.org" required
                                class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="flex flex-col gap-2">
                        <label for="password" class="text-sm font-medium text-ink-900">Password</label>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">
                                <i data-feather="lock" class="w-5 h-5"></i>
                            </div>
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                required
                                class="w-full pl-10 pr-4 py-3 bg-muted border-2 border-transparent rounded-lg text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-accent transition-colors duration-200" />
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="errorMsg"
                        class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
                        <i data-feather="alert-circle" class="w-4 h-4"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" id="submitBtn"
                        class="w-full mt-2 py-3 bg-accent hover:bg-accent-hover text-white font-semibold rounded-lg transition-all duration-200 flex items-center justify-center gap-2 group">
                        <span id="btnText">Sign In</span>
                        <i id="btnIcon" data-feather="arrow-right"
                            class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <!-- Divider -->
                    <div class="relative my-2">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-muted"></div>
                        </div>
                        <div class="relative flex justify-center text-xs">
                            <span class="px-2 bg-surface text-ink-500">New to Setu?</span>
                        </div>
                    </div>

                    <!-- Register Link -->
                    <a href="register.html"
                        class="w-full py-3 border-2 border-muted text-ink-900 font-semibold rounded-lg transition-all duration-200 hover:border-accent hover:bg-accent-light flex items-center justify-center gap-2">
                        <i data-feather="user-plus" class="w-4 h-4"></i>
                        <span>Create Account</span>
                    </a>
                </form>

            </div>

            <!-- Security Notice -->
            <div class="mt-8 p-4 bg-accent-light border border-accent/20 rounded-lg fade-in-up"
                style="animation-delay: 0.3s;">
                <div class="flex gap-3">
                    <i data-feather="shield" class="w-5 h-5 text-accent flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="text-sm font-medium text-ink-900 mb-1">Secured Connection</p>
                        <p class="text-xs text-ink-500">Your credentials are encrypted and transmitted securely.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-ink-900 text-white px-5 py-3 rounded-full text-sm font-medium shadow-float transform translate-y-8 opacity-0 transition-all duration-400 ease-out pointer-events-none flex items-center gap-2 z-50">
        <i data-feather="check-circle" class="w-4 h-4 text-white/70"></i>
        <span id="toastMsg">Action complete.</span>
    </div>

    <script src="js/api.js"></script>
    <script>
        feather.replace();

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Signing in...';

            try {
                const response = await ApiService.login({ email, password });

                if (!response.ok) {
                    showError(response.error || 'Invalid email or password');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Sign In';
                    return;
                }

                const data = response.data;

                // Store auth token and user info
                localStorage.setItem('auth_token', data.token || 'hackathon-secret');
                localStorage.setItem('user_email', email);
                localStorage.setItem('volunteer_id', data.volunteer_id || '');
                localStorage.setItem('user_name', data.name || '');

                showToast('Successfully signed in! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.');
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                errorMsg.classList.add('hidden');
            }, 5000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-8', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
        }
    </script>
</body>

</html>
