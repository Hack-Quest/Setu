<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU - Login</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="main-header">
        <div class="logo">SETU</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="map.html">Map</a>
            <button class="nav-run-btn" onclick="runMatching()">Run Matching</button>
            <a href="login.html" class="nav-login-btn">Login</a>
        </nav>
    </header>

    <div class="login-wrapper">
        <div class="login-card">

            <h2>🔐 Login with OTP</h2>
            <p class="sub">Secure access via email verification</p>

            <select id="role">
                <option value="volunteer">Volunteer</option>
                <option value="ngo">NGO</option>
            </select>

            <input type="email" id="email" placeholder="Enter your email">

            <button class="btn-primary" onclick="sendOTP()" id="sendBtn">
                Send OTP
            </button>

            <div id="otp-section" style="display: none;">
                <input type="text" id="otp" placeholder="Enter OTP">

                <button class="btn-success" onclick="verifyOTP()">
                    Verify & Login
                </button>
            </div>

        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
