<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU - Volunteer Dashboard</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">
        <div class="logo">SETU Volunteer</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="map.html">Map</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="container">

        <h1>Volunteer Dashboard</h1>

        <p style="margin-bottom: 20px; color: #948979;">
            ⚡ Assignments are automatically assigned by the system
        </p>

        <!-- PROFILE -->
        <div class="card">
            <h2 id="name">Loading...</h2>
            <p id="skills">Skills: Loading...</p>
            <p id="ngo">NGO: Loading...</p>
            <p id="status">Status: Loading...</p>
        </div>

        <!-- ASSIGNMENT -->
        <div class="card">
            <h3>Current Assignment</h3>
            <table class="dashboard-table" style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 10px;">
                <thead>
                    <tr style="background: rgba(59, 130, 246, 0.2); border-bottom: 2px solid #3b82f6;">
                        <th style="padding: 12px;">Reporter Name</th>
                        <th style="padding: 12px;">Location</th>
                        <th style="padding: 12px;">Disaster Type</th>
                        <th style="padding: 12px;">Description</th>
                        <th style="padding: 12px;">Status</th>
                        <th style="padding: 12px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="volunteerDashboardBody">
                    <tr><td colspan="6" style="padding: 12px; text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <div id="toast-container"></div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/volunteer-dashboard.js"></script>

</body>

</html>
