<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU - Volunteer Dashboard</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">
        <div class="logo">SETU Volunteer</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="map.html">Map</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="container">

        <h1>Volunteer Dashboard</h1>

        <p style="margin-bottom: 20px; color: #948979;">
            ⚡ Assignments are automatically assigned by the system
        </p>

        <!-- PROFILE -->
        <div class="card">
            <h2 id="name">Loading...</h2>
            <p id="skills">Skills: Loading...</p>
            <p id="ngo">NGO: Loading...</p>
            <p id="status">Status: Loading...</p>
        </div>

        <!-- ASSIGNMENT -->
        <div class="card">
            <h3>Current Assignment</h3>
            <div id="assignment">
                Loading assignment...
            </div>
        </div>

    </div>

    <script src="js/volunteer-dashboard.js"></script>

</body>

</html>
