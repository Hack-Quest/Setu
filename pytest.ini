[pytest]
testpaths =
    backend
    database
    tests
python_files =
    test_*.py
    *_test.py
norecursedirs =
    .*
    venv
    frontendnew
    node_modules
markers =
    integration: mark test as integration test (requires live database and server)
addopts = -m "not integration"
asyncio_mode = auto
